name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        # 依赖 MySQL / 网络 / 桌面 GUI 的用例在本环境不可用，仅跑纯离线单元测试。
        # tests/check_login.py 是手工排查脚本（非 pytest 用例），已显式排除。
        run: |
          pytest tests/ \
            --ignore=tests/check_login.py \
            -p no:cacheprovider
