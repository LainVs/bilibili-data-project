# 配置模板：复制为 settings.ini 后填入真实值（settings.ini 已被 git 忽略，不会入库）
# B站 Cookie 也可单独放在 config/bili_cookie.txt（同样不入库），优先级高于此处

[mysql]
host = 127.0.0.1
port = 3306
user = root
password = YOUR_PASSWORD
database = bilibili_data
charset = utf8mb4

# 写缓冲库 D（SSD）
[mysql_write]
host = 127.0.0.1
port = 3306
user = root
password = YOUR_PASSWORD
database = bilibili_data
charset = utf8mb4

# 归档库 E（HDD）
[mysql_archive]
host = 127.0.0.1
port = 3307
user = root
password = YOUR_PASSWORD
database = bilibili_data
charset = utf8mb4

[bilibili]
# 留空则从 config/bili_cookie.txt 读取
cookie =
user_agents =
request_delay = 0.65
request_delay_min = 0.4
request_delay_max = 0.9
up_workers = 3
danmaku_day_workers = 4
comment_sub_workers = 2
list_page_workers = 4
space_list_workers =
fav_list_workers =
relation_list_workers =
global_qps = 6.5
max_retries = 5
increment_interval_minutes = 60
